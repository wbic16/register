# register.phext.io — HTTP bootstrap vhost.
# Serves the register page over HTTP and answers ACME challenges so
# certbot can issue the first certificate. install-on-box.sh replaces
# this file with register.phext.io.https.conf once the cert exists.
server {
    listen 80;
    server_name register.phext.io;
    root /sites/web/register.phext.io;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires 5m;
    }
}
