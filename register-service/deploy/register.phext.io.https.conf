# register.phext.io — vhost pair, v2: adds the /api/ proxy to the
# register service (127.0.0.1:8791). Everything else is identical to
# the v1 pair installed 2026-11-15 (register-ui/deploy/).
server {
    listen 80;
    server_name register.phext.io;

    location /.well-known/acme-challenge/ {
        root /sites/web/register.phext.io;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name register.phext.io;
    root /sites/web/register.phext.io;

    ssl_certificate /etc/letsencrypt/live/register.phext.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/register.phext.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires 5m;
    }
}
